# OSS Close-UP 개발 환경
#   docker compose up -d --build   → db, backend 기동
#   curl http://localhost:8000/health
# worker(검사 도구)는 3단계에서 추가

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD 필요}
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB 필요}
    volumes:
      - pgdata:/var/lib/postgresql/data      # 컨테이너를 지워도 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      # GITHUB_TOKEN은 backend에 주지 않음 (검사를 하는 worker에만 3단계에서 전달)
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
